name: Robot Framework Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Robot Framework Browser
        run: |
          rfbrowser init

      - name: Run Robot Framework tests
        shell: bash
        run: |
          mkdir -p results

          TAG="${{ github.event.inputs.tag }}"

          if [[ -z "$TAG" || "$TAG" == "all" ]]; then
            robot \
              --outputdir results \
              tests/
          else
            robot \
              --include "$TAG" \
              --outputdir results \
              tests/
          fi

      - name: Upload Robot Framework reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robot-framework-results
          path: results/
          if-no-files-found: ignore
          retention-days: 14